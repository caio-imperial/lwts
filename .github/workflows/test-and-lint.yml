name: Test & Lint

# Fork: runs on every branch push (no pull requests are used) and can be
# triggered manually. Uses GitHub-hosted runners instead of the upstream
# self-hosted ARC runners.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -v -count=1 ./...

  go-test-postgres:
    name: Go Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector:pg16 ships postgres 16 with the vector extension
        # preinstalled. This unblocks the optional semantic search feature
        # being exercised by integration tests.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lwts_test
          POSTGRES_PASSWORD: lwts_test
          POSTGRES_DB: lwts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lwts_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # -p=1 serializes test packages. Integration tests share one postgres
      # instance, and concurrent CREATE TABLE / DROP SCHEMA between packages
      # races on the pg catalog (pg_type_typname_nsp_index), which shows up
      # as intermittent "duplicate key" / "no schema selected" failures.
      - run: go test -v -count=1 -p=1 -tags=integration ./...
        env:
          DB_URL: postgres://lwts_test:lwts_test@localhost:5432/lwts_test?sslmode=disable

  golangci-lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node --test tests/frontend/*.test.js

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
